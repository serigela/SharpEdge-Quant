name: CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scikit-learn
      - run: PYTHONPATH=src/python python -m unittest discover -s tests -p 'test_*.py' -v
      - run: g++ -std=c++17 -O2 -Isrc/cpp tests/backtester_repeat.cpp src/cpp/backtester.cpp -o /tmp/backtester_repeat && /tmp/backtester_repeat
